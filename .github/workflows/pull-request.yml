name: 🔥 Pull requests

on:
  pull_request:
  push:
    branches:
      - "renovate/**"
  workflow_dispatch:
  check_run:
    types:
      - requested_action

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  CI: 1
  ARTIFACT_DIR: ./artifacts

jobs:
  renovate-changeset:
    name: 🦋 Renovate Changeset
    if: |
      github.repository == 'rajzik/configs' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]'
        ) ||
        (
          github.event_name == 'push' &&
          startsWith(github.ref_name, 'renovate/')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: 🔄 Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: 🦋 Generate changeset
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node ./scripts/generate-renovate-changeset.js

      - name: 💾 Commit generated changeset
        env:
          BRANCH_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- .changeset; then
            echo "No generated changeset changes"
            exit 0
          fi

          git config user.name rajzik-bot
          git config user.email silhanu+releasebot@gmail.com
          git add .changeset
          git commit -m "chore: add renovate changeset"
          git push origin "HEAD:$BRANCH_REF"

  danger:
    name: 🔥 Danger
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha }}
          fetch-depth: 0

      - uses: ./.github/common-actions/install

      - name: 🔨 Build
        run: pnpm build

      - name: 🔥 Run Danger
        run: npx danger ci --use-github-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: danger-artifacts
          path: ${{ env.ARTIFACT_DIR }}


  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout branch
        uses: actions/checkout@v7

      - name: 📥 Setup
        uses: ./.github/common-actions/install

      - name: 🧪 Run tests
        run: pnpm test

  lint:
    name: ⬣ Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout branch
        uses: actions/checkout@v7

      - name: 📥 Setup
        uses: ./.github/common-actions/install

      - name: 🔬 Lint
        run: pnpm lint

  types:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout branch
        uses: actions/checkout@v7

      - name: 📥 Setup
        uses: ./.github/common-actions/install

      - name: 🔎 Type check
        run: pnpm typecheck

  oxfmt:
    name: 📝 Oxfmt
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout branch
        uses: actions/checkout@v7

      - name: 📥 Setup
        uses: ./.github/common-actions/install

      - name: 📝 Run oxfmt
        run: pnpm format

  continuous-release:
    name: 🦋 Continuous Release
    if: github.repository == 'rajzik/configs'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout branch
        uses: actions/checkout@v7

      - name: 📥 Setup
        uses: ./.github/common-actions/install

      - name: 🚀 PR Release
        run: pnpx pkg-pr-new publish --pnpm './packages/*'